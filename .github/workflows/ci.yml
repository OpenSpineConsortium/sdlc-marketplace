name: Checks

# The marketplace's checks on every pull request and every push to the
# default branch: bash scripts/check.sh, which verifies the vendored push
# guard against its VENDORED record and then runs the tests on Python
# 3.12. The job is named "check" so a ruleset can require it by that name;
# with that rule in place, the pull request symphony-protocol/sync, which
# symphony-protocol's sync opens here with each new copy of the guard,
# auto-merges only once this job is green. setup-python pins the
# interpreter, so the runner image moving to a newer Python changes
# nothing here. The runner has no claude binary, so check.sh skips claude
# plugin validate and says so; it runs wherever the checks are run by hand
# with Claude Code installed. A newer push to the same branch cancels the
# run still going.
# Before the checks the job clones OpenSpineConsortium/symphony-protocol,
# which is public, so the clone needs no token, and names the clone to
# them in SDLC_PROTOCOL. check.sh's vendoring.py verify holds the copy to
# plugins/sdlc/vendor/VENDORED, but both sit in this tree, and a pull
# request that edits the copy can rewrite its line in VENDORED as easily;
# with the clone named, tests/test_plugin.py compares every file of the
# copy with the library's at the commit VENDORED names, and fails, rather
# than skips, when the clone is missing or has no such commit, so neither
# edit passes the check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone symphony-protocol, the library the copy is held to
        run: git clone --quiet https://github.com/OpenSpineConsortium/symphony-protocol "$RUNNER_TEMP/symphony-protocol"

      - name: Run the checks
        env:
          SDLC_PROTOCOL: ${{ runner.temp }}/symphony-protocol
        run: bash scripts/check.sh
